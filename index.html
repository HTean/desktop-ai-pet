<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    #container {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    #bubble {
      display: none;

      background: white;
      color: black;

      padding: 10px 14px;
      border-radius: 15px;
      margin-bottom: 5px;

      font-family: Arial, sans-serif;
      font-size: 14px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.25);

      max-width: 250px;
      text-align: center;
    }

    /* 只有进入 Chat 模式时才把气泡加宽 */
    #bubble.chat-mode {
      width: 230px;
    }

    #bubbleText {
      white-space: pre-line;
    }

    #chatInput {
      width: 100%;
      box-sizing: border-box;

      margin-top: 8px;
      padding: 7px 9px;

      border: 1px solid #ccc;
      border-radius: 8px;

      font-family: Arial, sans-serif;
      font-size: 13px;

      outline: none;
    }

    #chatInput:focus {
      border-color: #777;
    }

    #pet {
      width: 200px;
      height: 200px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 120px;
      cursor: grab;
    }

    #pet:active {
      cursor: grabbing;
    }

    /* 宠物图片 */
    #petImage {
      width: 180px;
      height: 180px;
      object-fit: contain;
      pointer-events: none;
    }

    /* Task confirmation buttons */
    #confirmActions,
    #reminderActions,
    #snoozeActions {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #confirmActions button,
    #reminderActions button,
    #snoozeActions button {
      padding: 5px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      cursor: pointer;
    }

    #confirmActions button:hover,
    #reminderActions button:hover,
    #snoozeActions button:hover {
      background: #f0f0f0;
    }

  </style>
</head>

<body>

<div id="container">

  <div id="bubble">

  <!-- 奶牛说的话 -->
  <div id="bubbleText"></div>

  <!-- 双击后显示聊天输入框 -->
  <input
    id="chatInput"
    type="text"
    placeholder="Talk to Nainiu..."
    style="display: none;"
  >

  <!-- Task confirmation buttons -->
  <div id="confirmActions" style="display: none;">
    <button id="confirmYes">Yes</button>
    <button id="confirmNo">No</button>
  </div>

  <!-- Reminder actions -->
  <div id="reminderActions" style="display: none;">
    <button id="reminderComplete">
      Complete
    </button>

    <button id="reminderLater">
      Later
    </button>
  </div>


  <!-- Snooze choices -->
  <div id="snoozeActions" style="display: none;">
    <button id="snooze5">5m</button>
    <button id="snooze15">15m</button>
    <button id="snooze30">30m</button>
    <button id="snooze60">60m</button>
  </div>

</div>

  <div id="pet">
    <img id="petImage" src="assets/pet/idle.png">
  </div>

</div>

<script src="i18n.js"></script>

<script>
// Test commands: "add task"/"添加任务", "show my tasks"/“查看任务”, "open tasks"/“打开任务”

const pet = document.getElementById('pet');
const petImage = document.getElementById('petImage');
const bubble = document.getElementById('bubble');

const bubbleText =
  document.getElementById('bubbleText');

const chatInput =
  document.getElementById('chatInput');

const confirmActions =
  document.getElementById('confirmActions');

const confirmYes =
  document.getElementById('confirmYes');

const confirmNo =
  document.getElementById('confirmNo');

const reminderActions =
  document.getElementById(
    'reminderActions'
  );

const reminderComplete =
  document.getElementById(
    'reminderComplete'
  );

const reminderLater =
  document.getElementById(
    'reminderLater'
  );

const snoozeActions =
  document.getElementById(
    'snoozeActions'
  );

const snooze5 =
  document.getElementById('snooze5');

const snooze15 =
  document.getElementById('snooze15');

const snooze30 =
  document.getElementById('snooze30');

const snooze60 =
  document.getElementById('snooze60');


let currentReminder = null;

const reminderQueue = [];

// 暂时保存等待用户确认的任务
let pendingTask = null;

let pressed = false;
let isDragging = false;
let isHovering = false;
let isTalking = false;
let isSleeping = false;

let bubbleTimer;
let wagTimer;
let randomStateTimer;
let sleepTimer;
let singleClickTimer = null;
let isChatOpen = false;


// =====================================================
// 图片路径
// =====================================================

const images = {
  idle: 'assets/pet/idle.png',
  idle2: 'assets/pet/idle2.png',
  idle3: 'assets/pet/idle3.png',
  blink: 'assets/pet/blink.png',
  happy: 'assets/pet/happy.png',
  talk: 'assets/pet/talk.png',
  walk: 'assets/pet/walk.png',
  sleep: 'assets/pet/sleep.png'
};


// =====================================================
// 基础状态
// =====================================================

function showImage(state) {
  petImage.src = images[state];
}


// 根据当前情况恢复正确状态
function restoreState() {

  if (isDragging) {
    showImage('walk');
    return;
  }

  if (isTalking) {
    showImage('talk');
    return;
  }

  if (isSleeping) {
    showImage('sleep');
    return;
  }

  if (isHovering) {
    startWagging();
    return;
  }

  showImage('idle');
}


// =====================================================
// 摇尾巴
// hover 时 idle2 / idle3 循环
// =====================================================

function startWagging() {

  if (wagTimer) return;

  let useIdle2 = true;

  wagTimer = setInterval(() => {

    // 更高优先级状态出现时，不摇尾巴
    if (
      !isHovering ||
      isDragging ||
      isTalking ||
      isSleeping
    ) {
      return;
    }

    showImage(useIdle2 ? 'idle2' : 'idle3');

    useIdle2 = !useIdle2;

  }, 250);
}


function stopWagging() {

  clearInterval(wagTimer);

  wagTimer = null;
}


// =====================================================
// 睡眠系统
// 2 分钟没有互动 → sleep
// =====================================================

function resetSleepTimer() {

  clearTimeout(sleepTimer);

  // 有互动就醒来
  if (isSleeping) {
    isSleeping = false;
  }

  sleepTimer = setTimeout(() => {

    // 正在互动时不睡
    if (
      pressed ||
      isDragging ||
      isTalking ||
      isHovering
    ) {
      resetSleepTimer();
      return;
    }

    isSleeping = true;

    stopWagging();

    showImage('sleep');

  }, 2 * 60 * 1000);
}


// =====================================================
// 随机状态
// 每 8～40 秒随机 idle / blink / happy
// =====================================================

function scheduleRandomState() {

  clearTimeout(randomStateTimer);

  const delay =
    8000 + Math.random() * 32000;

  randomStateTimer = setTimeout(() => {

    // 正在进行其他行为时，这次随机动作跳过
    if (
      pressed ||
      isDragging ||
      isTalking ||
      isSleeping ||
      isHovering
    ) {
      scheduleRandomState();
      return;
    }


    const states = [
      'idle',
      'blink',
      'happy'
    ];

    const state =
      states[Math.floor(Math.random() * states.length)];


    // -------------------------
    // idle
    // -------------------------

    if (state === 'idle') {

      showImage('idle');

      scheduleRandomState();
    }


    // -------------------------
    // blink
    // -------------------------

    else if (state === 'blink') {

      showImage('blink');

      setTimeout(() => {

        restoreState();

        scheduleRandomState();

      }, 150);
    }


    // -------------------------
    // happy
    // -------------------------

    else if (state === 'happy') {

      showImage('happy');

      // Happy 持续 8～20 秒
      const duration =
        8000 + Math.random() * 12000;

      setTimeout(() => {

        restoreState();

        scheduleRandomState();

      }, duration);
    }

  }, delay);
}


// =====================================================
// Hover
// 鼠标放到宠物上 → 摇尾巴
// =====================================================

pet.addEventListener('mouseenter', () => {

  isHovering = true;

  resetSleepTimer();

  // 睡觉时鼠标靠近 → 醒来
  isSleeping = false;

  startWagging();
});


pet.addEventListener('mouseleave', () => {

  isHovering = false;

  stopWagging();

  if (
    !isDragging &&
    !isTalking &&
    !isSleeping
  ) {
    showImage('idle');
  }
});


// =====================================================
// 按下宠物
// =====================================================

pet.addEventListener('pointerdown', () => {

  pressed = true;
  isDragging = false;

  resetSleepTimer();

  window.petAPI.startDrag();
});


// =====================================================
// 鼠标移动
// 按住后移动 → walk
// =====================================================

window.addEventListener('pointermove', () => {

  if (!pressed) return;

  isDragging = true;

  stopWagging();

  showImage('walk');

  window.petAPI.moveDrag();
});


// =====================================================
// 松开
// =====================================================

window.addEventListener('pointerup', async () => {

  if (!pressed) return;

  pressed = false;

  const moved =
    await window.petAPI.endDrag();


  // Electron 判断确实发生了拖动
  if (moved) {

    isDragging = false;

    restoreState();

  } else {

    isDragging = false;

    // 双击已经打开 Chat 时，不再触发普通单击
    if (isChatOpen) return;

    clearTimeout(singleClickTimer);

    singleClickTimer = setTimeout(() => {

      // Timer 执行前再检查一次
      if (!isChatOpen) {
        talk();
      }

    }, 250);
  }

});


// =====================================================
// 点击说话
// =====================================================

function talk() {

    // Reminder has priority over normal speech
  if (currentReminder) return;

  resetSleepTimer();

  stopWagging();

  isTalking = true;

  // 切换说话图片
  showImage('talk');


  // Get pet messages from current language
  const messages = window.i18n.t('petMessages');

  const message =
    messages[Math.floor(Math.random() * messages.length)];

  // 普通说话模式，不显示输入框
  bubble.classList.remove('chat-mode');

  chatInput.style.display = 'none';

  bubbleText.textContent = message;

  bubble.style.display = 'block';


  // talk.png 显示 700ms
  setTimeout(() => {

    isTalking = false;

    restoreState();

  }, 700);


  clearTimeout(bubbleTimer);


  // 对话框 2.5 秒后消失
  bubbleTimer = setTimeout(() => {

    bubble.style.display = 'none';

  }, 2500);
}

// =====================================================
// 双击奶牛：打开 Chat 输入框
// =====================================================

pet.addEventListener('dblclick', () => {

    // Do not replace an active reminder with Chat
    if (currentReminder) return;

    pendingTask = null;
    confirmActions.style.display = 'none';

    // 锁定 Chat 模式
    isChatOpen = true;

    // 取消等待中的普通单击
    clearTimeout(singleClickTimer);

    // 取消普通说话框的自动关闭 timer
    clearTimeout(bubbleTimer);

    resetSleepTimer();

    bubble.classList.add('chat-mode');

    bubbleText.textContent =
      window.i18n.t('chatPrompt');

    chatInput.placeholder =
      window.i18n.t('chatPlaceholder');

    chatInput.value = '';
    chatInput.style.display = 'block';

    bubble.style.display = 'block';

    setTimeout(() => {
      chatInput.focus();
    }, 50);
  });

// =====================================================
// Chat input
// 目前只测试输入，之后再接 Task / AI
// =====================================================

chatInput.addEventListener('keydown', async (event) => {

// =====================================================
// Enter = process chat command
// =====================================================

if (event.key === 'Enter') {

    const text = chatInput.value.trim();

    if (!text) return;

    // Lowercase version only for checking commands
    const command = text.toLowerCase();


    // -------------------------------------------------
    // 1. Add task
    // Example:
    // add task Buy groceries
    // -------------------------------------------------

    if (
        command.startsWith('add task ') ||
        /^添加任务[:：]?\s*/.test(text)
      ) {

        const title =
          command.startsWith('add task ')
            ? text.substring(9).trim()
            : text.replace(/^添加任务[:：]?\s*/, '').trim();

      if (!title) return;

      await window.petAPI.addTask({
        title: title,
        description: '',
        dueAt: null,
        priority: 'normal'
      });

      bubbleText.textContent =
        window.i18n.t('taskAdded', { title });
    }


    // -------------------------------------------------
    // 2. Show number of pending tasks
    // -------------------------------------------------

    else if (
        command === 'show my tasks' ||
        command === 'show tasks' ||
        command === '查看我的任务' ||
        command === '查看任务'
      ) {

      const tasks =
        await window.petAPI.getTasks();

      const pendingTasks =
        tasks.filter(
          task => task.status !== 'completed'
        );

      if (pendingTasks.length === 0) {

        bubbleText.textContent =
          window.i18n.t('noPendingTasks');

      } else if (pendingTasks.length === 1) {

        bubbleText.textContent =
          window.i18n.t('onePendingTask');

      } else {

        bubbleText.textContent =
          window.i18n.t(
            'multiplePendingTasks',
            { count: pendingTasks.length }
          );
      }
    }


    // -------------------------------------------------
    // 3. Open full Tasks window
    // -------------------------------------------------

    else if (
        command === 'open tasks' ||
        command === 'open my tasks' ||
        command === '打开任务' ||
        command === '打开我的任务'
      ) {

      bubbleText.textContent =
        window.i18n.t('openingTasks');

      await window.petAPI.openTasksWindow();
    }


    // -------------------------------------------------
    // Unknown command
    // -------------------------------------------------

    else {

      // 尝试从自然语言中识别任务 + 日期/时间
      const parsedTask =
        await window.petAPI.parseTaskText(text);


      // 只有识别到了任务内容 + 日期/时间
      // 才自动判断为 Task
      if (
        parsedTask.title &&
        parsedTask.dueAt
      ) {

        // 暂存任务，等待用户确认
        pendingTask = parsedTask;


        // Translate recurrence value
        const recurrenceText = {
          daily: window.i18n.t('recurrenceDaily'),
          weekly: window.i18n.t('recurrenceWeekly'),
          monthly: window.i18n.t('recurrenceMonthly')
        }[parsedTask.recurrence];


        // 使用当前语言显示确认信息
        bubbleText.textContent =
          `${window.i18n.t('taskLabel')}: ${parsedTask.title}\n` +
          `${window.i18n.t('dueLabel')}: ${parsedTask.dueAt}\n` +
          (
            recurrenceText
              ? `${window.i18n.t('recurrenceLabel')}: ${recurrenceText}\n`
              : ''
          ) +
          window.i18n.t('addThisTask');


        // 隐藏输入框
        chatInput.style.display = 'none';


        // 显示 Yes / No
        confirmActions.style.display = 'flex';


        // 保持 Chat 开启
        isChatOpen = true;


        // 不执行下面关闭 Chat 的代码
        return;

      } else {

        // 没识别到时间 → 普通聊天
        bubbleText.textContent =
          window.i18n.t('youSaid', { text });
      }
    }


    // Hide input after command
    chatInput.value = '';
    chatInput.style.display = 'none';

    bubble.classList.remove('chat-mode');

    isChatOpen = false;


    // Keep response visible briefly
    clearTimeout(bubbleTimer);

    bubbleTimer = setTimeout(() => {
      bubble.style.display = 'none';
    }, 2500);
  }


  // Escape
  if (event.key === 'Escape') {

    isChatOpen = false;

    chatInput.value = '';
    chatInput.style.display = 'none';
    bubble.classList.remove('chat-mode');
    bubble.style.display = 'none';
  }
});

// =====================================================
// Confirm task: Yes
// =====================================================

confirmYes.addEventListener('click', async () => {

  if (!pendingTask) return;

  // 用户确认后才真正写入 SQLite
  await window.petAPI.addTask(pendingTask);

  bubbleText.textContent =
    window.i18n.t(
      'taskAdded',
      { title: pendingTask.title }
    );

  pendingTask = null;

  confirmActions.style.display = 'none';

  isChatOpen = false;

  clearTimeout(bubbleTimer);

  bubbleTimer = setTimeout(() => {
    bubble.style.display = 'none';
  }, 1800);
});


// =====================================================
// Confirm task: No
// =====================================================

confirmNo.addEventListener('click', () => {

  pendingTask = null;

  confirmActions.style.display = 'none';

  bubbleText.textContent =
    window.i18n.t('taskRejected');

  isChatOpen = false;

  clearTimeout(bubbleTimer);

  bubbleTimer = setTimeout(() => {
    bubble.style.display = 'none';
  }, 1500);
});

// =====================================================
// Pet Reminder System
// =====================================================

function formatReminderDateTime(date) {

  const pad = value =>
    String(value).padStart(2, '0');

  return (
    date.getFullYear() +
    '-' +
    pad(date.getMonth() + 1) +
    '-' +
    pad(date.getDate()) +
    'T' +
    pad(date.getHours()) +
    ':' +
    pad(date.getMinutes())
  );
}


// =====================================================
// Show next queued reminder
// =====================================================

function showNextReminder() {

  if (
    currentReminder ||
    reminderQueue.length === 0
  ) {
    return;
  }


  currentReminder =
    reminderQueue.shift();


  // Reminder takes priority over Chat / task confirmation
  pendingTask = null;
  isChatOpen = false;

  clearTimeout(
    singleClickTimer
  );

  clearTimeout(
    bubbleTimer
  );


  confirmActions.style.display =
    'none';

  chatInput.value = '';
  chatInput.style.display =
    'none';


  snoozeActions.style.display =
    'none';

  reminderActions.style.display =
    'flex';


  bubble.classList.add(
    'chat-mode'
  );


  bubbleText.textContent =
    window.i18n.t(
      'reminderDue',
      {
        title:
          currentReminder.task_title
      }
    );


  // Keep pet awake while reminder is active
  isSleeping = false;
  isTalking = true;

  stopWagging();

  showImage('talk');

  bubble.style.display =
    'block';

  resetSleepTimer();
}


// =====================================================
// Close current reminder
// =====================================================

function closeCurrentReminder() {

  reminderActions.style.display =
    'none';

  snoozeActions.style.display =
    'none';

  bubble.style.display =
    'none';

  bubble.classList.remove(
    'chat-mode'
  );


  currentReminder = null;

  isTalking = false;

  restoreState();

  resetSleepTimer();


  // If several reminders became due together,
  // show the next one
  showNextReminder();
}


// =====================================================
// Complete reminder task
// =====================================================

reminderComplete.addEventListener(
  'click',
  async () => {

    if (!currentReminder) {
      return;
    }


    const reminder =
      currentReminder;


    await window.petAPI.completeTask(
      reminder.task_id
    );

    closeCurrentReminder();
  }
);


// =====================================================
// Later button
// =====================================================

reminderLater.addEventListener(
  'click',
  () => {

    if (!currentReminder) {
      return;
    }


    reminderActions.style.display =
      'none';

    snoozeActions.style.display =
      'flex';
  }
);


// =====================================================
// Snooze
// =====================================================

async function snoozeCurrentReminder(
  minutes
) {

  if (!currentReminder) {
    return;
  }


  const reminder =
    currentReminder;


  const newTime =
    new Date(
      Date.now() +
      minutes * 60 * 1000
    );


  await window.petAPI.snoozeReminder({
    id: reminder.id,

    remindAt:
      formatReminderDateTime(
        newTime
      )
  });


  closeCurrentReminder();
}


snooze5.addEventListener(
  'click',
  () => snoozeCurrentReminder(5)
);

snooze15.addEventListener(
  'click',
  () => snoozeCurrentReminder(15)
);

snooze30.addEventListener(
  'click',
  () => snoozeCurrentReminder(30)
);

snooze60.addEventListener(
  'click',
  () => snoozeCurrentReminder(60)
);


// =====================================================
// Receive reminder from main process
// =====================================================

window.petAPI.onReminderDue(
  (reminder) => {

    const reminderId =
      Number(reminder.id);


    // Prevent duplicates
    if (
      currentReminder &&
      Number(currentReminder.id) ===
        reminderId
    ) {
      return;
    }


    if (
      reminderQueue.some(
        item =>
          Number(item.id) ===
          reminderId
      )
    ) {
      return;
    }


    reminderQueue.push(
      reminder
    );


    showNextReminder();
  }
);

// =====================================================
// 点击奶牛窗口外 → 关闭对话框
// =====================================================

window.addEventListener('blur', () => {

  // Reminder stays until user chooses an action
  if (currentReminder) return;

  isChatOpen = false;

  chatInput.value = '';
  chatInput.style.display = 'none';

  bubble.classList.remove('chat-mode');

  bubble.style.display = 'none';
});


// =====================================================
// 透明区域鼠标穿透
// 奶牛和聊天气泡都需要接收鼠标事件
// =====================================================

document.addEventListener('mousemove', (event) => {

  const element = document.elementFromPoint(
    event.clientX,
    event.clientY
  );

  // 奶牛或者聊天气泡上 = 不穿透
  const onInteractiveArea = element && (
    element.id === 'pet' ||
    element.closest('#pet') ||
    element.id === 'bubble' ||
    element.closest('#bubble')
  );

  // 其他透明区域 = 鼠标穿透到底下的软件
  window.petAPI.setIgnoreMouseEvents(
    !onInteractiveArea
  );
});


// =====================================================
// 禁用默认右键菜单
// =====================================================

document.addEventListener('contextmenu', (event) => {
  event.preventDefault();
});


// =====================================================
// 启动宠物系统
// =====================================================

// Apply current language to confirmation buttons
confirmYes.textContent = window.i18n.t('yes');
confirmNo.textContent = window.i18n.t('no');

reminderComplete.textContent =
  window.i18n.t('complete');

reminderLater.textContent =
  window.i18n.t('reminderLater');

snooze5.textContent =
  window.i18n.t('snooze5');

snooze15.textContent =
  window.i18n.t('snooze15');

snooze30.textContent =
  window.i18n.t('snooze30');

snooze60.textContent =
  window.i18n.t('snooze60');

showImage('idle');

scheduleRandomState();

resetSleepTimer();

</script>

</body>
</html>
